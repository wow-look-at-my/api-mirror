name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1

  validate-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The schema is an XML 1.1 document like every spec, so it is validated
      # like one. Patterns rather than names, so a file added later is covered.
      - uses: wow-look-at-my/xml-validator@master
        with:
          files: '**/*.xml **/*.xsd'
