name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1

  validate-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate XML specs and schema (well-formedness, XML 1.1)
        run: |
          curl -fsSL --compressed -o /usr/local/bin/xml-validator \
            "https://dl.pazer.build/xml-validator?os=linux&arch=amd64"
          chmod +x /usr/local/bin/xml-validator
          xml-validator mirror.example.xml
          xml-validator mirror.schema.xsd
          xml-validator samples/github/github.xml
