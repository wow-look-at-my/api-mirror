name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master

  validate-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The schema is an XML 1.1 document too, and a pattern covers a file added later.
      - uses: wow-look-at-my/xml-validator@master
        with:
          files: '**/*.xml **/*.xsd'
