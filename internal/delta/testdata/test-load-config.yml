
listen: 127.0.0.1:9999
truth:
  url: https://api.example/
  headers:
    Authorization: token ${DELTA_TEST_TOKEN}
mirrors:
  - name: local
    url: http://127.0.0.1:8080
timeout: 5s
ignore:
  - path: $..url
    kinds: [missing]
    reason: the mirror drops URL fields
  - header: Link
  - method: get
    route: ^/rate_limit$
    kinds: [changed]
